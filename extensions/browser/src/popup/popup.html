<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrammarLens</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #111827;
      background: #FAFAFA;
    }
    .header {
      padding: 16px;
      background: #2563EB;
      color: white;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .header p { font-size: 12px; opacity: 0.8; margin-top: 4px; }
    .status {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #E5E7EB;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .status-dot.connected { background: #22C55E; }
    .status-dot.disconnected { background: #EF4444; }
    .status-text { font-size: 13px; color: #4B5563; }
    .content { padding: 16px; }
    .content p { font-size: 13px; color: #6B7280; line-height: 1.5; }
    .link {
      display: block;
      margin-top: 12px;
      color: #2563EB;
      text-decoration: none;
      font-size: 13px;
    }
    .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <h1>GrammarLens</h1>
    <p>Privacy-first grammar checker</p>
  </div>
  <div class="status" id="status">
    <div class="status-dot disconnected" id="statusDot"></div>
    <span class="status-text" id="statusText">Checking connection...</span>
  </div>
  <div class="content">
    <p>
      GrammarLens checks your text for grammar, spelling, punctuation, and style
      issues using AI that runs entirely on your computer.
    </p>
    <p style="margin-top: 8px;">
      Your text never leaves your device.
    </p>
    <a class="link" href="#" id="settingsLink">Open GrammarLens App</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
