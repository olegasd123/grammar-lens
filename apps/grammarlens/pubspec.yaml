name: grammarlens
description: GrammarLens — Privacy-first grammar checker powered by local AI.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  get_it: ^8.0.3
  grammar_engine:
    path: ../../packages/grammar_engine
  grammarlens_ui:
    path: ../../packages/grammarlens_ui
  llama_inference:
    path: ../../packages/llama_inference
  logging: ^1.3.0
  model_repository:
    path: ../../packages/model_repository
  platform_integration:
    path: ../../packages/platform_integration

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

resolution: workspace
