name: grammarlens_workspace
description: GrammarLens monorepo workspace
repository: https://github.com/grammarlens/grammarlens

environment:
  sdk: ">=3.6.0 <4.0.0"

workspace:
  - apps/grammarlens
  - packages/grammar_engine
  - packages/llama_inference
  - packages/model_repository
  - packages/grammarlens_ui
  - packages/platform_integration

dev_dependencies:
  melos: ^7.4.0

melos:
  command:
    version:
      message: "chore: release %v"
      linkToCommits: true

  scripts:
    analyze:
      exec: dart analyze --fatal-infos
      description: Run analyzer in all packages
      packageFilters:
        dirExists: lib

    test:
      exec: flutter test
      description: Run tests in all packages
      packageFilters:
        dirExists: test

    test:unit:
      exec: flutter test --no-pub
      description: Run unit tests only
      packageFilters:
        dirExists: test
        ignore:
          - "*integration*"

    generate:
      exec: dart run build_runner build --delete-conflicting-outputs
      description: Run code generation (freezed, injectable, etc.)
      packageFilters:
        dependsOn: build_runner

    generate:watch:
      exec: dart run build_runner watch --delete-conflicting-outputs
      description: Watch and run code generation
      packageFilters:
        dependsOn: build_runner

    ffigen:
      exec: dart run ffigen --config ffigen.yaml
      description: Regenerate llama.cpp FFI bindings
      packageFilters:
        fileExists: ffigen.yaml

    format:
      exec: dart format .
      description: Format all Dart code

    clean:
      exec: flutter clean
      description: Clean all packages

    lint:fix:
      exec: dart fix --apply
      description: Apply automatic lint fixes
