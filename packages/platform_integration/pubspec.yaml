name: platform_integration
description: Platform-specific text access, accessibility, keyboard, and hotkey integration for GrammarLens.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.3.0
  meta: ^1.16.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.grammarlens.platform_integration
        pluginClass: PlatformIntegrationPlugin
      ios:
        pluginClass: PlatformIntegrationPlugin
      macos:
        pluginClass: PlatformIntegrationPlugin
      windows:
        pluginClass: PlatformIntegrationPluginCApi
      linux:
        pluginClass: PlatformIntegrationPlugin

resolution: workspace
