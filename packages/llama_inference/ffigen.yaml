name: LlamaBindings
description: Auto-generated FFI bindings for llama.cpp
output: lib/src/bindings/llama_bindings.dart
headers:
  entry-points:
    - ../../vendor/llama.cpp/include/llama.h
  include-directives:
    - ../../vendor/llama.cpp/include/llama.h
compiler-opts:
  - -I../../vendor/llama.cpp/include
  - -I../../vendor/llama.cpp/ggml/include
preamble: |
  // AUTO-GENERATED FILE - DO NOT EDIT
  // Generated by ffigen from llama.cpp headers
  // ignore_for_file: type=lint
  // ignore_for_file: unused_field
  // ignore_for_file: unused_element
comments:
  style: any
  length: full
type-map:
  native-types:
    char:
      lib: ffi
      c-type: Char
      dart-type: int
