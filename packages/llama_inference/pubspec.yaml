name: llama_inference
description: Flutter FFI bindings for llama.cpp - local LLM inference engine
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  logging: ^1.3.0
  meta: ^1.16.0
  path: ^1.9.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true

resolution: workspace
